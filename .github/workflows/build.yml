name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # One stable key for every build, so each APK installs over the last
      # one without an uninstall.
      - name: Ensure stable keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Boss,O=Ketu,C=IN"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f app/debug.keystore
            git commit -m "ci: add stable signing key [skip ci]"
            git push
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build release APK
        env:
          BOSS_BUG_URL: ${{ secrets.BOSS_BUG_URL }}
          BOSS_BUG_WRITE_KEY: ${{ secrets.BOSS_BUG_WRITE_KEY }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Name the APK
        id: name
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          DST="boss-v1.0.${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$DST"
          echo "apk=$DST" >> "$GITHUB_OUTPUT"
          ls -lh "$DST"

      - uses: actions/upload-artifact@v4
        with:
          name: boss-apk
          path: ${{ steps.name.outputs.apk }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Boss v1.0.${{ github.run_number }}
          files: ${{ steps.name.outputs.apk }}
          generate_release_notes: true
